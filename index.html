<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Shivang Rai: B.Tech ECE (VLSI) student at MAIT Delhi working on RAG, agentic AI and LLM evaluation.">
<title>Shivang Rai Homepage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark single-column "flight" page. Hero is two columns (name and facts left, cycling photos right). A fixed starfield moves forward as you scroll. */
:root {
  --bg: #0a0a0b;
  --fg: #ecebe6;
  --muted: #8b8f99;
  --line: #23252b;
  --panel: #111215;
  --accent: #8fd3e0;
  --font-name: "Unbounded", "Syne", "Helvetica Neue", Arial, sans-serif;
  --font-display: "Syne", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --measure: 66rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 5.5rem; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 1.0625rem/1.65 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.ln { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.ln:hover { color: var(--accent); text-decoration-thickness: 2px; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.page { position: relative; z-index: 1; max-width: var(--measure); margin: 0 auto; }

/* Top bar */
.top {
  position: sticky; top: 0; z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: max(.7rem, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) .7rem max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
.top .in { max-width: var(--measure); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .35rem 1.5rem; }
.logo { font: 700 .9rem var(--font-name); text-decoration: none; letter-spacing: -.01em; }
.top nav { display: flex; flex-wrap: wrap; align-items: center; gap: .2rem 1.3rem; }
.top nav a { font: 500 .75rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; color: var(--muted); padding: .2rem 0; }
.top nav a:hover { color: var(--accent); }
.top nav a.resume { color: var(--bg); background: var(--fg); padding: .25rem .8rem; border-radius: 999px; }
.top nav a.resume:hover { background: var(--accent); color: var(--bg); }

/* Shared */
.label { font: 500 .72rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
section { padding-block: 5.5rem 1rem; }
h2 { font: 800 clamp(2rem, 6.5vw, 3.6rem)/1.04 var(--font-display); letter-spacing: -.02em; margin: .6rem 0 2.2rem; text-wrap: balance; max-width: 18ch; }
.tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; padding: 0; list-style: none; }
.tags li { font: 400 .74rem var(--font-mono); color: var(--accent); border: 1px solid var(--line); padding: .15rem .55rem; border-radius: 999px; }
.pill { font: 500 .7rem var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); padding: .12rem .55rem; border-radius: 999px; white-space: nowrap; }

/* Hero */
.hero {
  padding-top: 4.5rem; padding-bottom: 1rem; min-height: min(46rem, 92svh);
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  grid-template-areas: "name photo" "info photo";
  column-gap: clamp(1.5rem, 5vw, 4rem); row-gap: 2rem; align-content: center;
}
.h-name { grid-area: name; align-self: end; display: grid; gap: 1.1rem; min-width: 0; }
.h-photo { grid-area: photo; align-self: center; min-width: 0; }
.h-info { grid-area: info; align-self: start; display: grid; gap: 1.8rem; min-width: 0; }
.hero h1 { font: 700 clamp(2.3rem, 7.4vw, 4.9rem)/1.02 var(--font-name); letter-spacing: -.04em; margin: 0; }
.hero h1 span { display: block; }
.facts { display: grid; gap: 1rem 2rem; grid-template-columns: repeat(auto-fit, minmax(11.5rem, 1fr)); }
.facts div { display: grid; gap: .15rem; border-top: 1px solid var(--line); padding-top: .7rem; }
.facts span:last-child { font-size: 1rem; }
.intro { max-width: 34rem; font-size: 1.12rem; margin: 0; }
.cta { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1rem; }
.btn { font: 600 .95rem var(--font-body); text-decoration: none; background: var(--fg); color: var(--bg); padding: .75rem 1.3rem; border-radius: 999px; border: 1px solid var(--fg); }
.btn:hover { background: var(--accent); border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { color: var(--accent); border-color: var(--accent); background: transparent; }
.hint { font: 400 .72rem var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* Cycling photos */
.stack { position: relative; aspect-ratio: 4 / 5; width: 100%; max-width: 26rem; margin-left: auto; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: 0; transform: scale(1.04); transition: opacity .9s ease, transform 4s ease; }
.stack img.on { opacity: 1; transform: scale(1); }
.pbar { max-width: 26rem; margin: .8rem 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.dots { display: flex; gap: .45rem; }
.dots button { width: .6rem; height: .6rem; padding: 0; border-radius: 50%; border: 1px solid var(--muted); background: transparent; cursor: pointer; }
.dots button[aria-current="true"] { background: var(--accent); border-color: var(--accent); }
@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "name" "photo" "info"; padding-top: 3.5rem; min-height: 0; row-gap: 1.6rem; }
  .stack, .pbar { margin-left: 0; max-width: 20rem; }
}

/* Selected */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
.card { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem; display: grid; gap: .9rem; align-content: start; min-width: 0; transition: border-color .2s, transform .2s; }
.card:hover { border-color: var(--accent); transform: translateY(-3px); }
.card h3 { font: 700 1.45rem/1.15 var(--font-display); margin: 0; letter-spacing: -.01em; }
.card ul.pts { margin: 0; padding-left: 1.1rem; color: #c9cbd1; font-size: .98rem; }
.card ul.pts li { margin-bottom: .45rem; }
.card ul.pts li::marker { color: var(--accent); }


.plinks { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .2rem; }
.plinks a { font: 500 .78rem var(--font-mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--line); padding: .35rem .8rem; border-radius: 999px; }
.plinks a:hover { color: var(--accent); border-color: var(--accent); }

/* Rows */
.rows { border-top: 1px solid var(--line); }
details.row { border-bottom: 1px solid var(--line); }
details.row summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 9.5rem 1fr auto; gap: .3rem 1.5rem; align-items: baseline; padding: 1.15rem 0; }
details.row summary::-webkit-details-marker { display: none; }
.row .when { font: 400 .8rem var(--font-mono); color: var(--muted); }
.row .what b { display: block; font: 700 1.25rem/1.25 var(--font-display); letter-spacing: -.005em; }
.row .what small { color: var(--muted); font-size: .92rem; }
.row .plus { font: 400 1.4rem/1 var(--font-mono); color: var(--accent); transition: transform .2s; }
details[open] .plus { transform: rotate(45deg); }
details.row summary:hover b { color: var(--accent); }
.row .body { padding: 0 0 1.4rem calc(9.5rem + 1.5rem); max-width: 48rem; color: #c9cbd1; }
.row .body ul { margin: 0; padding-left: 1.1rem; }
.row .body li { margin-bottom: .5rem; }
.row .body li::marker { color: var(--accent); }
@media (max-width: 640px) {
  details.row summary { grid-template-columns: 1fr auto; }
  .row .when { grid-column: 1 / -1; }
  .row .body { padding-left: 0; }
}

/* About */
.about-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 3rem; }
@media (max-width: 760px) { .about-grid { grid-template-columns: 1fr; gap: 2rem; } }
.about-grid p { margin: 0 0 1rem; max-width: 36rem; }
.block { margin-bottom: 2rem; }
.block h3 { font: 500 .72rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 .8rem; }
.edu { display: grid; border-top: 1px solid var(--line); }
.edu div { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; padding: .8rem 0; border-bottom: 1px solid var(--line); }
.edu b { font-weight: 600; }
.edu small { color: var(--muted); grid-column: 1; font-size: .88rem; }
.edu .m { font: 400 .85rem var(--font-mono); color: var(--accent); text-align: right; grid-row: 1; grid-column: 2; }
.list { margin: 0; padding-left: 1.1rem; }
.list li { margin-bottom: .45rem; }
.list li::marker { color: var(--accent); }
dl.skills { margin: 0; display: grid; gap: .9rem; }
dl.skills dt { font: 500 .72rem var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
dl.skills dd { margin: .2rem 0 0; }

/* Footer: socials and details */
footer { margin-top: 6rem; padding-block: 2rem 4.5rem; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 2rem; }
footer h3 { font: 500 .72rem var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 .8rem; }
footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
footer li { overflow-wrap: anywhere; }
footer .fine { grid-column: 1 / -1; color: var(--muted); font: 400 .78rem var(--font-mono); letter-spacing: .06em; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem 2rem; }

/* Flight meter */
.meter { position: fixed; z-index: 15; left: max(16px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); font: 400 .7rem var(--font-mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; display: flex; gap: .7rem; align-items: center; pointer-events: none; background: color-mix(in srgb, var(--bg) 80%, transparent); padding: .25rem .5rem; border-radius: 4px; }
.meter i { display: block; width: 3.5rem; height: 2px; background: var(--line); position: relative; }
.meter i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(var(--p, 0)); }

.js .rise { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
.js .rise.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .js .rise { opacity: 1; transform: none; transition: none; }
  .card, .stack img { transition: none; }
}
</style>
